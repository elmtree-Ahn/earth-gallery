<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바다 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0C1826;
    --panel: #152840;
    --line: #23405E;
    --text: #F2F7FC;
    --muted: #93A9BF;
    --accent: #53C6EC;
    --korea: #F0B24E;
    --ero: #F08A6B;
    --dep: #7BD389;
    --font-display: 'Jua', 'Apple SD Gothic Neo', sans-serif;
    --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 20px clamp(12px, 3vw, 40px) 40px;
  }
  header { text-align: center; margin-bottom: 18px; position: relative; }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(28px, 4.5vw, 46px);
    letter-spacing: 1px;
  }
  header h1 .wave { color: var(--accent); }
  header p { color: var(--muted); font-size: clamp(13px, 1.6vw, 17px); margin-top: 4px; }
  .switch {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 14px;
  }
  .switch:hover { background: var(--panel); }

  .viewer {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .stage { position: relative; background: #060D16; }
  .stage img {
    display: block;
    width: 100%;
    height: clamp(300px, 56vh, 620px);
    object-fit: contain;
  }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(12, 24, 38, 0.65);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 24px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav:hover, .nav:focus-visible { background: var(--accent); color: #06121D; }
  .nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }

  .caption { padding: 16px 22px 20px; text-align: center; }
  .caption .name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(24px, 3.2vw, 36px);
  }
  .caption .name .emoji { margin-right: 8px; }
  .caption .place {
    color: var(--accent);
    font-size: clamp(15px, 2vw, 20px);
    font-weight: 700;
    margin-top: 6px;
  }
  .tag {
    display: inline-block;
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .tag.kr { background: var(--korea); color: #3A2A08; }
  .tag.world { background: var(--accent); color: #06222E; }
  .tag.ero { background: var(--ero); color: #3D1508; }
  .tag.dep { background: var(--dep); color: #0C3315; }
  .tag.video { background: #C89BF0; color: #2A0D42; }
  .caption .fact { color: var(--muted); font-size: clamp(13px, 1.7vw, 16px); margin-top: 8px; }

  .carousel {
    max-width: 1100px;
    margin: 20px auto 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .car-nav {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--text);
    border: 2px solid var(--line);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .car-nav:hover, .car-nav:focus-visible { background: var(--accent); border-color: var(--accent); color: #06121D; }
  .car-nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .track {
    flex: 1;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 6px 2px;
  }
  .track::-webkit-scrollbar { display: none; }
  .track button {
    flex: 0 0 auto;
    width: 118px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(15px, 1.7vw, 18px);
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 6px;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .track button .emoji { display: block; font-size: 26px; margin-bottom: 4px; }
  .track button:hover { transform: translateY(-3px); border-color: var(--accent); }
  .track button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .track button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06121D;
  }
  footer {
    max-width: 1100px;
    margin: 26px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  @media (prefers-reduced-motion: reduce) {
    .track button, .nav, .car-nav { transition: none; }
    .track button:hover { transform: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="wave">🌊</span> 바다 탐험대</h1>
  <p>파도가 깎고, 쌓아서 만든 바닷가 지형을 살펴보아요</p>
  <a class="switch" href="index.html">🌏 지표 탐험대로 가기</a>
</header>

<div class="viewer">
  <div class="stage">
    <img id="photo" src="" alt="">
    <button class="nav prev" id="prevBtn" aria-label="이전 사진">◀</button>
    <button class="nav next" id="nextBtn" aria-label="다음 사진">▶</button>
  </div>
  <div class="caption">
    <div class="name" id="capName"></div>
    <div class="place" id="capPlace"></div>
    <div class="fact" id="capFact"></div>
  </div>
</div>

<div class="carousel">
  <button class="car-nav" id="carPrev" aria-label="버튼 목록 왼쪽으로">◀</button>
  <div class="track" id="buttons"></div>
  <button class="car-nav" id="carNext" aria-label="버튼 목록 오른쪽으로">▶</button>
</div>

<footer>사진 출처: 위키미디어 공용(Wikimedia Commons), 자유 이용 저작물 · 초등 3학년 과학 '바닷가 지형' 수업 자료 · 참고 영상: 국가지질공원 '바다가 만든 지형과 지질'</footer>

<script>
const ITEMS = [
  { name: "해식동굴", emoji: "🕳️", file: "coast-benagil.jpg", kr: false, group: "ero", video: false,
    place: "벤아길 해식동굴 · 포르투갈 알가르브",
    fact: "파도가 절벽 아래를 오랫동안 파내서 만든 동굴이에요. 천장에 뚫린 구멍으로 햇빛이 들어와요. 우리나라 마라도에도 해식동굴이 있어요!" },
  { name: "해식아치", emoji: "🐘", file: "coast-elephant.jpg", kr: true, group: "ero", video: true,
    place: "황금산 코끼리바위 · 충청남도 서산시",
    fact: "파도가 바위에 구멍을 뚫어 코끼리가 물을 마시는 모양이 되었어요. 수업 영상에 나온 바로 그곳!" },
  { name: "해식아치", emoji: "🌉", file: "coast-durdle.jpg", kr: false, group: "ero", video: false,
    place: "더들 도어 · 영국 도싯 해안",
    fact: "바위에 뚫린 커다란 돌문이에요. 파도가 약한 부분부터 뚫어서 만들었어요." },
  { name: "해식기둥", emoji: "🗿", file: "coast-dumujin.jpg", kr: true, group: "ero", video: true,
    place: "백령도 두무진 · 인천광역시 옹진군",
    fact: "해안을 따라 4km나 병풍처럼 서 있는 돌기둥들이에요. 수업 영상에 나온 바로 그곳!" },
  { name: "해식기둥", emoji: "🪨", file: "coast-oedolgae.jpg", kr: true, group: "ero", video: false,
    place: "외돌개 · 제주특별자치도 서귀포시",
    fact: "바다 위에 홀로 우뚝 선 돌기둥이에요. '외롭게 홀로 서 있는 돌'이라서 외돌개라고 불러요." },
  { name: "해식기둥", emoji: "🏝️", file: "coast-apostles.jpg", kr: false, group: "ero", video: false,
    place: "12사도 바위 · 오스트레일리아 빅토리아",
    fact: "절벽이 파도에 깎이고 남은 부분이 기둥이 되었어요. 지금도 조금씩 깎여서 하나씩 무너지고 있대요." },
  { name: "해식절벽", emoji: "📚", file: "coast-chaeseok.jpg", kr: true, group: "ero", video: false,
    place: "채석강 · 전북특별자치도 부안군 (국가지질공원)",
    fact: "수만 권의 책을 쌓아 놓은 것 같은 절벽이에요. 파도가 깎아서 속의 줄무늬 지층이 드러났어요." },
  { name: "해식절벽", emoji: "🤍", file: "coast-dover.jpg", kr: false, group: "ero", video: false,
    place: "도버 백악 절벽 · 영국",
    fact: "아주 작은 바다 생물 껍데기가 쌓여 만들어진 하얀 절벽을 파도가 깎았어요. 바다가 만들고, 바다가 깎은 절벽!" },
  { name: "모래사장", emoji: "🏖️", file: "sea.jpg", kr: true, group: "dep", video: false,
    place: "협재해수욕장 · 제주특별자치도 제주시 한림읍",
    fact: "파도가 모래를 실어 와 오랫동안 쌓아서 만든 바닷가예요." },
  { name: "해안사구", emoji: "⏳", file: "coast-sinduri.jpg", kr: true, group: "dep", video: false,
    place: "신두리 해안사구 · 충청남도 태안군",
    fact: "바닷바람이 모래사장의 모래를 날려 쌓은 우리나라에서 가장 큰 모래 언덕이에요." },
  { name: "갯벌", emoji: "🦀", file: "mudflat.jpg", kr: true, group: "dep", video: false,
    place: "고창 갯벌 · 전북특별자치도 고창군 (유네스코 세계유산)",
    fact: "바닷물이 고운 흙을 실어 와 쌓은 부드러운 진흙 땅이에요. 물이 빠지면 드러나요." },
];

let current = 0;
const photo = document.getElementById("photo");
const capName = document.getElementById("capName");
const capPlace = document.getElementById("capPlace");
const capFact = document.getElementById("capFact");
const buttonsEl = document.getElementById("buttons");

ITEMS.forEach((item, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="emoji">${item.emoji}</span>${item.name}`;
  b.addEventListener("click", () => show(i));
  buttonsEl.appendChild(b);
});

function show(i) {
  current = (i + ITEMS.length) % ITEMS.length;
  const item = ITEMS[current];
  photo.src = "images/" + item.file;
  photo.alt = `${item.name} - ${item.place}`;
  capName.innerHTML = `<span class="emoji">${item.emoji}</span>${item.name}`;
  let tags = item.kr ? '<span class="tag kr">우리나라</span>' : '<span class="tag world">세계</span>';
  tags += item.group === "ero" ? '<span class="tag ero">바다가 깎았어요</span>' : '<span class="tag dep">바다가 쌓았어요</span>';
  if (item.video) tags += '<span class="tag video">★ 수업 영상 속 장소</span>';
  capPlace.innerHTML = item.place + tags;
  capFact.textContent = item.fact;
  buttonsEl.querySelectorAll("button").forEach((b, j) => {
    b.classList.toggle("active", j === current);
    if (j === current) {
      buttonsEl.scrollLeft = b.offsetLeft - buttonsEl.clientWidth / 2 + b.offsetWidth / 2;
    }
  });
}

document.getElementById("prevBtn").addEventListener("click", () => show(current - 1));
document.getElementById("nextBtn").addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "ArrowRight") show(current + 1);
});
document.getElementById("carPrev").addEventListener("click", () =>
  buttonsEl.scrollLeft -= buttonsEl.clientWidth * 0.8);
document.getElementById("carNext").addEventListener("click", () =>
  buttonsEl.scrollLeft += buttonsEl.clientWidth * 0.8);

show(0);
</script>
</body>
</html>
