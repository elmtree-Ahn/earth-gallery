<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지표 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0C1826;
    --panel: #152840;
    --line: #23405E;
    --text: #F2F7FC;
    --muted: #93A9BF;
    --accent: #53C6EC;
    --korea: #F0B24E;
    --font-display: 'Jua', 'Apple SD Gothic Neo', sans-serif;
    --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 20px clamp(12px, 3vw, 40px) 40px;
  }
  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(28px, 4.5vw, 46px);
    letter-spacing: 1px;
  }
  header h1 .globe { color: var(--accent); }
  header p { color: var(--muted); font-size: clamp(13px, 1.6vw, 17px); margin-top: 4px; }

  .viewer {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .stage { position: relative; background: #060D16; }
  .stage img {
    display: block;
    width: 100%;
    height: clamp(300px, 56vh, 620px);
    object-fit: contain;
  }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(12, 24, 38, 0.65);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 24px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav:hover, .nav:focus-visible { background: var(--accent); color: #06121D; }
  .nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }

  .caption { padding: 16px 22px 20px; text-align: center; }
  .caption .name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(24px, 3.2vw, 36px);
  }
  .caption .name .emoji { margin-right: 8px; }
  .caption .place {
    color: var(--accent);
    font-size: clamp(15px, 2vw, 20px);
    font-weight: 700;
    margin-top: 6px;
  }
  .caption .place .tag {
    display: inline-block;
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .tag.kr { background: var(--korea); color: #3A2A08; }
  .tag.world { background: var(--accent); color: #06222E; }
  .caption .fact { color: var(--muted); font-size: clamp(13px, 1.7vw, 16px); margin-top: 8px; }

  .carousel {
    max-width: 1100px;
    margin: 20px auto 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .car-nav {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--text);
    border: 2px solid var(--line);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .car-nav:hover, .car-nav:focus-visible { background: var(--accent); border-color: var(--accent); color: #06121D; }
  .car-nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .track {
    flex: 1;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 6px 2px;
  }
  .track::-webkit-scrollbar { display: none; }
  .track button {
    flex: 0 0 auto;
    width: 118px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(16px, 1.8vw, 19px);
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 6px;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .track button .emoji { display: block; font-size: 26px; margin-bottom: 4px; }
  .track button:hover { transform: translateY(-3px); border-color: var(--accent); }
  .track button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .track button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06121D;
  }
  footer {
    max-width: 1100px;
    margin: 26px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  @media (prefers-reduced-motion: reduce) {
    .buttons button, .nav { transition: none; }
    .buttons button:hover { transform: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="globe">🌏</span> 지표 탐험대</h1>
  <p>버튼을 눌러 지구 표면의 여러 모습을 살펴보아요</p>
</header>

<div class="viewer">
  <div class="stage">
    <img id="photo" src="" alt="">
    <button class="nav prev" id="prevBtn" aria-label="이전 사진">◀</button>
    <button class="nav next" id="nextBtn" aria-label="다음 사진">▶</button>
  </div>
  <div class="caption">
    <div class="name" id="capName"></div>
    <div class="place" id="capPlace"></div>
    <div class="fact" id="capFact"></div>
  </div>
</div>

<div class="carousel">
  <button class="car-nav" id="carPrev" aria-label="버튼 목록 왼쪽으로">◀</button>
  <div class="track" id="buttons"></div>
  <button class="car-nav" id="carNext" aria-label="버튼 목록 오른쪽으로">▶</button>
</div>

<footer>사진 출처: 위키미디어 공용(Wikimedia Commons), 자유 이용 저작물 · 초등 3학년 과학 '지구의 모습' 수업 자료</footer>

<script>
const ITEMS = [
  { name: "바다", emoji: "🌊", file: "sea.jpg", kr: true,
    place: "협재해수욕장과 비양도 · 제주특별자치도 제주시 한림읍",
    fact: "에메랄드빛 바닷물 너머로 작은 화산섬인 비양도가 보여요." },
  { name: "산호초 바다", emoji: "🐠", file: "reef.jpg", kr: false,
    place: "그레이트배리어리프(대보초) · 오스트레일리아",
    fact: "세계에서 가장 큰 산호초 바다예요. 너무 커서 우주에서도 보인답니다!" },
  { name: "산", emoji: "⛰️", file: "mountain.jpg", kr: true,
    place: "설악산 울산바위 · 강원특별자치도 속초시",
    fact: "커다란 바위 봉우리가 하늘을 향해 우뚝 솟아 있어요. 왜 이런 모양이 되었을까요?" },
  { name: "들", emoji: "🌾", file: "field.jpg", kr: true,
    place: "대관령 양떼목장 · 강원특별자치도 평창군",
    fact: "산 위의 넓고 평평한 풀밭이에요. 양들이 풀을 뜯으며 살아요." },
  { name: "강", emoji: "🏞️", file: "river.jpg", kr: true,
    place: "한반도 지형(서강) · 강원특별자치도 영월군",
    fact: "강물이 굽이쳐 흐르면서 우리나라 지도를 꼭 닮은 땅 모양을 만들었어요!" },
  { name: "호수", emoji: "💧", file: "lake.jpg", kr: true,
    place: "백두산 천지 · 한반도에서 가장 높은 산꼭대기",
    fact: "화산이 폭발한 뒤 움푹 파인 곳에 물이 고여 만들어진 호수예요." },
  { name: "갯벌", emoji: "🦀", file: "mudflat.jpg", kr: true,
    place: "고창 갯벌 · 전북특별자치도 고창군 (유네스코 세계유산)",
    fact: "바닷물이 빠지면 드러나는 부드러운 진흙 땅이에요. 조개와 게가 살아요." },
  { name: "갈대 습지", emoji: "🐦", file: "reed.jpg", kr: true,
    place: "순천만 습지 · 전라남도 순천시",
    fact: "물기가 많은 땅에 갈대가 가득해요. 겨울마다 철새들이 찾아와요." },
  { name: "화산", emoji: "🌋", file: "volcano.jpg", kr: true,
    place: "성산일출봉 · 제주특별자치도 서귀포시 (유네스코 세계자연유산)",
    fact: "바닷속에서 화산이 폭발해 만들어졌어요. 가운데가 그릇처럼 움푹 파여 있지요?" },
  { name: "활화산", emoji: "🔥", file: "lava.jpg", kr: false,
    place: "킬라우에아 화산 · 미국 하와이",
    fact: "지금도 뜨거운 용암이 솟아오르는 살아 있는 화산이에요. 용암이 식으면 새 땅이 됩니다." },
  { name: "주상절리", emoji: "🪨", file: "columnar.jpg", kr: true,
    place: "대포 주상절리대 · 제주특별자치도 서귀포시 중문",
    fact: "뜨거운 용암이 바닷물에 식으면서 돌기둥이 차곡차곡 만들어졌어요." },
  { name: "폭포", emoji: "💦", file: "waterfall.jpg", kr: true,
    place: "정방폭포 · 제주특별자치도 서귀포시",
    fact: "우리나라에서 보기 드물게 바다로 바로 떨어지는 폭포예요." },
  { name: "사막", emoji: "🐪", file: "desert.jpg", kr: false,
    place: "나미브 사막 '듄 45' · 아프리카 나미비아",
    fact: "비가 거의 오지 않아 모래로 뒤덮인 땅이에요. 모래 언덕 색이 붉어요." },
  { name: "빙하", emoji: "🧊", file: "glacier.jpg", kr: false,
    place: "페리토 모레노 빙하 · 남아메리카 아르헨티나",
    fact: "눈이 오랫동안 쌓이고 눌려서 만들어진 거대한 얼음 덩어리예요." },
  { name: "빙산 호수", emoji: "❄️", file: "iceberg.jpg", kr: false,
    place: "요쿨살론 빙하 호수 · 아이슬란드",
    fact: "빙하 끝에서 떨어져 나온 파란 얼음산이 호수 위에 둥둥 떠 있어요." },
  { name: "협곡", emoji: "🏜️", file: "canyon.jpg", kr: false,
    place: "그랜드캐니언 · 미국 애리조나주",
    fact: "강물이 아주 오랜 시간 땅을 깎아서 만든 깊은 골짜기예요." },
  { name: "소금사막", emoji: "🧂", file: "saltflat.jpg", kr: false,
    place: "우유니 소금사막 · 남아메리카 볼리비아",
    fact: "옛날에 바다였던 곳의 물이 마르고 소금만 남았어요. 비가 오면 거울처럼 변해요!" },
  { name: "온천", emoji: "♨️", file: "hotspring.jpg", kr: false,
    place: "그랜드 프리즈매틱 온천 · 미국 옐로스톤 국립공원",
    fact: "땅속 뜨거운 물이 솟아나는 곳이에요. 무지개처럼 알록달록한 색을 띠어요." },
];

let current = 0;
const photo = document.getElementById("photo");
const capName = document.getElementById("capName");
const capPlace = document.getElementById("capPlace");
const capFact = document.getElementById("capFact");
const buttonsEl = document.getElementById("buttons");

ITEMS.forEach((item, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="emoji">${item.emoji}</span>${item.name}`;
  b.addEventListener("click", () => show(i));
  buttonsEl.appendChild(b);
});

function show(i) {
  current = (i + ITEMS.length) % ITEMS.length;
  const item = ITEMS[current];
  photo.src = "images/" + item.file;
  photo.alt = `${item.name} - ${item.place}`;
  capName.innerHTML = `<span class="emoji">${item.emoji}</span>${item.name}`;
  const tag = item.kr ? '<span class="tag kr">우리나라</span>' : '<span class="tag world">세계</span>';
  capPlace.innerHTML = item.place + tag;
  capFact.textContent = item.fact;
  buttonsEl.querySelectorAll("button").forEach((b, j) => {
    b.classList.toggle("active", j === current);
    if (j === current) {
      buttonsEl.scrollLeft = b.offsetLeft - buttonsEl.clientWidth / 2 + b.offsetWidth / 2;
    }
  });
}

document.getElementById("carPrev").addEventListener("click", () =>
  buttonsEl.scrollLeft -= buttonsEl.clientWidth * 0.8);
document.getElementById("carNext").addEventListener("click", () =>
  buttonsEl.scrollLeft += buttonsEl.clientWidth * 0.8);

document.getElementById("prevBtn").addEventListener("click", () => show(current - 1));
document.getElementById("nextBtn").addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "ArrowRight") show(current + 1);
});

show(0);
</script>
</body>
</html>
